
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanaya Vakharia</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F6F3EC;
      color: #282720;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 35px 6%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #77756E;
    }

    .dot {
      height: 7px;
      width: 7px;
      background: #873D48;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      max-width: 750px;
      width: 100%;
      margin: auto;
    }

    .eyebrow {
      color: #873D48;
      letter-spacing: 2.5px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 27px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(75px, 12vw, 150px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -4px;
    }

    h1 span {
      display: block;
      color: #873D48;
      font-style: italic;
      font-weight: 400;
    }

    .description {
      margin-top: 35px;
      max-width: 460px;
      font-size: 15px;
      line-height: 1.9;
      color: #77756E;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #DDD9CF;
      padding-top: 22px;
      font-size: 11px;
      color: #77756E;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px;
      }

      .status {
        font-size: 8px;
      }

      h1 {
        letter-spacing: -2px;
        font-size: clamp(60px, 13vw, 90px);
      }

      .description {
        font-size: 14px;
      }

      footer {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="name">Sanaya Vakharia.</div>

      <div class="status">
        <span class="dot"></span>
        WORK IN PROGRESS
      </div>
    </header>

    <main>
      <p class="eyebrow">A LITTLE REDESIGN IN PROGRESS</p>

      <h1>
        Currently
        <span>building.</span>
      </h1>

      <p class="description">
        My little corner of the internet is getting a refresh.
        I'm putting together a space for the things I've worked on,
        the ideas I'm exploring, and whatever comes next.
      </p>
    </main>

    <footer>
      <span>© 2026 Sanaya Vakharia</span>
      <span>More soon. ✳</span>
    </footer>

  </div>
</body>
</html>
